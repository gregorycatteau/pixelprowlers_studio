# PixelProwlers Studio — NATS JetStream Configuration (Sprint 0)
#
# Architecture:
# - 3 accounts: dojo, clients, honeypot (isolation)
# - JetStream enabled for persistent streaming
# - Deny-by-default ACL model (explicit allow per account)
# - Subjects MVO: intake.*, spec.*, build.*, release.*, incident.*
#
# Local dev credentials (CHANGE IN PRODUCTION):
#   dojo     → user: dojo_user     / pass: dojo_pass
#   clients  → user: clients_user  / pass: clients_pass
#   honeypot → user: honeypot_user / pass: honeypot_pass
#
# Monitoring:
#   HTTP endpoint on :8222 (metrics, healthz, varz)
#
# Notes:
# - For production: use NKeys or JWT-based auth instead of plaintext passwords
# - Honeypot account is read-only (subscribe only) for security monitoring
# - dojo account has full pub/sub on all MVO subjects
# - clients account has limited publish rights (intake.* only)

# ──────────────────────────────────────────────────────────────────────────────
# Server Configuration
# ──────────────────────────────────────────────────────────────────────────────

server_name: pxp_nats_local
listen: 0.0.0.0:4222
http_port: 8222

# JetStream configuration
jetstream {
  store_dir: /data/nats
  max_mem: 1G
  max_file: 10G
}

# ──────────────────────────────────────────────────────────────────────────────
# Accounts
# ──────────────────────────────────────────────────────────────────────────────

accounts {
  # ────────────────────────────────────────────────────────────────────────────
  # DOJO account — internal agency operations (full access to MVO subjects)
  # ────────────────────────────────────────────────────────────────────────────
  DOJO {
    jetstream: enabled

    users = [
      {
        user: dojo_user
        password: dojo_pass
      }
    ]

    # Permissions: explicit allow (deny-by-default)
    permissions {
      publish {
        allow: [
          "intake.>",     # All intake events (lead.created, etc.)
          "spec.>",       # Specification events
          "build.>",      # Build pipeline events
          "release.>",    # Release/deployment events
          "incident.>",   # Incident management events
          "_INBOX.>",     # Request/reply patterns
          "$JS.>"         # JetStream API access
        ]
      }
      subscribe {
        allow: [
          "intake.>",
          "spec.>",
          "build.>",
          "release.>",
          "incident.>",
          "_INBOX.>",
          "$JS.>"
        ]
      }
    }
  }

  # ────────────────────────────────────────────────────────────────────────────
  # CLIENTS account — limited publish rights (intake only)
  # ────────────────────────────────────────────────────────────────────────────
  CLIENTS {
    jetstream: enabled

    users = [
      {
        user: clients_user
        password: clients_pass
      }
    ]

    # Permissions: clients can only publish intake events (e.g., via webhooks)
    # and subscribe to their own responses (via _INBOX for request/reply)
    permissions {
      publish {
        allow: [
          "intake.lead.>",      # Lead creation/updates
          "intake.inquiry.>",   # Client inquiries
          "_INBOX.>"            # Request/reply responses
        ]
      }
      subscribe {
        allow: [
          "_INBOX.>",           # Only their own reply subjects
          "client.notifications.>" # Optional: dedicated client notifications
        ]
      }
    }
  }

  # ────────────────────────────────────────────────────────────────────────────
  # HONEYPOT account — read-only monitoring (security/audit)
  # ────────────────────────────────────────────────────────────────────────────
  HONEYPOT {
    jetstream: disabled  # No need for persistence on honeypot

    users = [
      {
        user: honeypot_user
        password: honeypot_pass
      }
    ]

    # Permissions: subscribe-only (no publish) for security monitoring
    permissions {
      publish {
        deny: [">"]  # Deny all publishes
      }
      subscribe {
        allow: [
          "intake.>",
          "spec.>",
          "build.>",
          "release.>",
          "incident.>",
          "client.>"
        ]
      }
    }
  }

  # ────────────────────────────────────────────────────────────────────────────
  # System account (required for monitoring/admin)
  # ────────────────────────────────────────────────────────────────────────────
  SYS {
    users = [
      {
        user: sys_admin
        password: sys_admin_pass
      }
    ]
  }
}

# Set system account (required for server events/monitoring)
system_account: SYS

# ──────────────────────────────────────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────────────────────────────────────

# Options: trace, debug, info, warn, error, fatal
# Use 'debug' in local dev, 'info' or 'warn' in production
log_file: /dev/stdout
debug: false
trace: false
logtime: true

# ──────────────────────────────────────────────────────────────────────────────
# Limits (reasonable for local dev)
# ──────────────────────────────────────────────────────────────────────────────

max_connections: 100
max_payload: 1MB
max_pending: 64MB

