name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry and pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install backend dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Install linters/typecheckers
        run: poetry run python -m pip install --disable-pip-version-check flake8 mypy

      - name: Lint (flake8)
        run: poetry run flake8 .

      - name: Typecheck (mypy)
        run: poetry run mypy . --ignore-missing-imports --no-error-summary --pretty

      - name: Tests (Django)
        run: poetry run python manage.py test --verbosity 2

  frontend:
    name: Frontend (lint, typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run -s lint

      - name: Lint (Stylelint)
        run: npm run -s stylelint

      - name: Typecheck (vue-tsc)
        run: npm run -s typecheck

      - name: Tests (if configured)
        run: |
          if grep -E '"test"[[:space:]]*:' package.json >/dev/null; then
            npm run -s test
          else
            echo "No frontend tests configured; skipping"
          fi
