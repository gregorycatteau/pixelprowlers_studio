# .sops.yaml — SOPS configuration for PixelProwlers Studio
#
# This file defines which age public keys are used to encrypt secrets
# based on file path patterns.
#
# IMPORTANT:
# - Replace the placeholder age public keys below with your actual keys
# - Generate age keys with: age-keygen -o ops/secret/keys/local.key
# - Extract public key with: grep 'public key:' ops/secret/keys/local.key
#
# Usage:
#   sops --encrypt ops/secret/dev/app.env > ops/secret/dev/app.env.enc
#   sops --decrypt ops/secret/dev/app.env.enc
#   sops ops/secret/dev/app.env.enc  # Edit in-place
#
# See ops/secret/README.md for detailed instructions.

creation_rules:
  # ────────────────────────────────────────────────────────────────────────────
  # Development / Local secrets
  # ────────────────────────────────────────────────────────────────────────────
  - path_regex: ops/secret/dev/.*\.enc$
    age: >-
      age1replacethiswithyourdevpublickey1234567890abcdefghijklmnopqrstu

  # ────────────────────────────────────────────────────────────────────────────
  # Staging secrets
  # ────────────────────────────────────────────────────────────────────────────
  - path_regex: ops/secret/staging/.*\.enc$
    age: >-
      age1replacethiswithyourstagingpublickey234567890abcdefghijklmnopqrs

  # ────────────────────────────────────────────────────────────────────────────
  # Production secrets (highest security)
  # ────────────────────────────────────────────────────────────────────────────
  - path_regex: ops/secret/prod/.*\.enc$
    age: >-
      age1replacethiswithyourprodpublickey34567890abcdefghijklmnopqrstuv

  # ────────────────────────────────────────────────────────────────────────────
  # Fallback: any other .enc file in ops/secret/ uses dev key
  # ────────────────────────────────────────────────────────────────────────────
  - path_regex: ops/secret/.*\.enc$
    age: >-
      age1replacethiswithyourdevpublickey1234567890abcdefghijklmnopqrstu

# ──────────────────────────────────────────────────────────────────────────────
# Global defaults (optional)
# ──────────────────────────────────────────────────────────────────────────────

# Uncomment to set default age key file path
# destination_rules:
#   - path_regex: .*
#     age: /path/to/default/key.txt

# MAC validation (always enabled, ensures file integrity)
# If you see "MAC mismatch" errors, the encrypted file may be corrupted

# ──────────────────────────────────────────────────────────────────────────────
# Multi-recipient example (for team collaboration)
# ──────────────────────────────────────────────────────────────────────────────
#
# To allow multiple developers to decrypt the same file, add multiple age keys:
#
# - path_regex: ops/secret/dev/.*\.enc$
#   age: >-
#     age1alice...,
#     age1bob...,
#     age1charlie...
#
# Each person can decrypt with their own private key.
# To update recipients: sops updatekeys ops/secret/dev/file.enc

# ──────────────────────────────────────────────────────────────────────────────
# Next steps:
# ──────────────────────────────────────────────────────────────────────────────
#
# 1. Generate your age key:
#    age-keygen -o ops/secret/keys/local.key
#
# 2. Get your public key:
#    grep 'public key:' ops/secret/keys/local.key
#
# 3. Replace the placeholder keys above with your public key
#
# 4. Test encryption:
#    echo "SECRET=test123" > /tmp/test.env
#    sops --encrypt /tmp/test.env > ops/secret/dev/test.env.enc
#    sops --decrypt ops/secret/dev/test.env.enc
#
# 5. Read the full guide: ops/secret/README.md
