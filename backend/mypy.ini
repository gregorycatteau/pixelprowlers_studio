# mypy baseline configuration for PixelProwlers Studio — backend (Django)
# Docs: https://mypy.readthedocs.io/en/stable/config_file.html

[mypy]
python_version = 3.13

# Core strictness (progressively enforce across codebase)
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True

# Warnings to keep the codebase clean
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True
warn_return_any = True

# Imports and output
ignore_missing_imports = True
follow_imports = silent
pretty = True
show_error_codes = True
namespace_packages = True

# ----------------------------------------------------------------------
# Exemptions for generated/testing code (reduce noise, focus on product code)
# Django migrations (auto-generated)
[mypy-*.migrations.*]
ignore_errors = True

# Tests (often looser typing at first; can be tightened later)
[mypy-*.tests.*]
ignore_errors = True

[mypy-*.tests]
ignore_errors = True

[mypy-tests.*]
ignore_errors = True
